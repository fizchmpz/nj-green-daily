name: daily-report

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00（GitHub 定时可能有几分钟延迟）
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成日报
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_PUSH: "1"
        run: python scraper.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "日报更新 $(date -u -d '+8 hours' +%F)"
            git push
          fi

      - name: 失败告警
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s --max-time 20 \
            -H "Title: 南京日报生成失败" -H "Tags: warning" \
            -d "云端日报生成失败了，上线看一眼 Actions 日志。" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
